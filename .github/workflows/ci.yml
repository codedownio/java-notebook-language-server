name: ci

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: tests
    runs-on: arc-public-large
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_env

    - name: Run tests
      run: |
        TESTS=$(nix build --no-link --print-out-paths .#tests)/bin/java-notebook-language-server-test
        "$TESTS" --print

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-runs
        path: test_runs/

  no-gmp:
    runs-on: arc-public-small
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_env

    - name: No GMP
      run: |
        nix run .#verify-no-gmp

  nix:
    name: Nix
    runs-on: arc-public-small
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/arc_env

    - name: Build
      run: |
        nix build
